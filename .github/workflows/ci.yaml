
name: Hello World CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build message
        run: echo "Build job started"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test message
        run: echo "Test job started"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy message
        run: echo "Deploy job started"
